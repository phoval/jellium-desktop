name: build-windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            platform: windows64
            msystem: CLANG64
            pkg_prefix: mingw-w64-clang-x86_64
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      MSI_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
          workspaces: |
            src -> target
            src -> ../build/cargo-target

      - uses: ./.github/actions/setup-cef
        with:
          platform: ${{ github.workflow }}-${{ matrix.arch }}

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.pkg_prefix }}-cc
            ${{ matrix.pkg_prefix }}-clang
            ${{ matrix.pkg_prefix }}-meson
            ${{ matrix.pkg_prefix }}-pkgconf
            ${{ matrix.pkg_prefix }}-ffmpeg
            ${{ matrix.pkg_prefix }}-ffnvcodec-headers
            ${{ matrix.pkg_prefix }}-libplacebo
            ${{ matrix.pkg_prefix }}-libass
            ${{ matrix.pkg_prefix }}-luajit
            ${{ matrix.pkg_prefix }}-vulkan-headers
            ${{ matrix.pkg_prefix }}-vulkan-loader
            ${{ matrix.pkg_prefix }}-shaderc
            ${{ matrix.pkg_prefix }}-spirv-cross
            ${{ matrix.pkg_prefix }}-llvm
            ${{ matrix.pkg_prefix }}-tools

      - name: Determine mpv cache identity
        id: mpv-key
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          # The hosted image version covers MSVC and the Windows SDK; pacman
          # versions cover the compiler, build tools, and transitive native deps.
          if (-not $env:ImageOS -or -not $env:ImageVersion) {
            throw "Hosted runner image identity is missing"
          }
          $Packages = & (Join-Path $env:MSYS2_ROOT 'usr\bin\pacman.exe') -Q
          if ($LASTEXITCODE -ne 0) { throw "Failed to read MSYS2 package versions" }
          $Identity = (@($env:ImageOS, $env:ImageVersion) + @($Packages | Sort-Object)) -join "`n"
          $Hash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData(
            [System.Text.Encoding]::UTF8.GetBytes($Identity)))
          $Revision = & git -C third_party/mpv rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Failed to read mpv revision" }
          "environment=$Hash" >> $env:GITHUB_OUTPUT
          "revision=$Revision" >> $env:GITHUB_OUTPUT

      - name: Cache built mpv
        id: mpv-cache
        uses: actions/cache@v6
        with:
          # Cache the complete install, including headers, import libs, and DLLs.
          # No restore-keys: native binaries require an exact environment match.
          path: third_party/mpv-install
          key: mpv-${{ runner.os }}-${{ matrix.arch }}-${{ steps.mpv-key.outputs.revision }}-${{ hashFiles('dev/windows/build_mpv_source.ps1') }}-${{ steps.mpv-key.outputs.environment }}

      - name: Build mpv from source
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          dev\windows\build_mpv_source.ps1 -Arch ${{ matrix.arch }} -MsysPath $env:MSYS2_ROOT

      - name: Build and package
        shell: cmd
        env:
          # bindgen (used by jfn-mpv's build.rs) dlopens libclang at
          # build time. The mingw-w64-clang-*-llvm package ships
          # libclang.dll under the msystem prefix's bin/; cmd.exe
          # doesn't pick that up from setup-msys2, so point bindgen
          # at it explicitly.
          LIBCLANG_PATH: ${{ steps.msys2.outputs.msys2-location }}\${{ matrix.msystem }}\bin
          MSYS_BIN: ${{ steps.msys2.outputs.msys2-location }}\${{ matrix.msystem }}\bin
          # mingw's libclang doesn't auto-pick the MSVC target triple, so
          # MSVC's arch-specific headers (__int64, vcruntime intrinsics,
          # etc.) get parsed against the wrong default target. Pin it.
          BINDGEN_EXTRA_CLANG_ARGS: --target=${{ matrix.triple }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MSI_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" %MATRIX_ARCH% || exit /b 1
          set "PATH=%PATH%;%MSYS_BIN%"
          cargo xtask package --external-mpv "%CD%\third_party\mpv-install" --prefix build/install --dist dist || exit /b 1
          rem Reuse the payload package just staged, with the same vcvars environment.
          pwsh -NoLogo -ExecutionPolicy Bypass -File dev\windows\installer\build_msi.ps1 -SkipStage -StageDir build\install -Arch %MATRIX_ARCH% -Validate || exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/JelliumDesktop-*.zip

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-msi
          path: dist/JelliumDesktop-*.msi
          if-no-files-found: error
